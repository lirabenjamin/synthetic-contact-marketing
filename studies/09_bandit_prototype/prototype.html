<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunCell investment game (prototype)</title>
<style>
  :root { --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --card: #f9fafb; --green: #15803d; --red: #b91c1c; --btn: #374151; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f3f4f6; line-height: 1.5; }
  .page { max-width: 760px; margin: 2rem auto; background: #fff; border-radius: 12px; padding: 2rem 2.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 1.4rem; margin-bottom: .75rem; }
  p { margin-bottom: .8rem; }
  .muted { color: var(--muted); font-size: .92rem; }
  .primary-btn { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: .7rem 1.6rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .primary-btn:hover:not(:disabled) { background: #1d4ed8; }
  .primary-btn:disabled { opacity: .45; cursor: not-allowed; }
  .secondary-btn { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: .7rem 1.4rem; font-size: 1rem; cursor: pointer; }
  .actions { margin-top: 1.25rem; display: flex; justify-content: space-between; }
  .steps { font-size: .8rem; color: var(--muted); margin-bottom: .5rem; }
  .big-emoji { font-size: 2rem; }

  /* money bar */
  .bank { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.25rem; }
  .bank > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; text-align: center; }
  .bank .lbl { font-size: .8rem; color: var(--muted); }
  .bank .val { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .val.pos { color: var(--green); } .val.neg { color: var(--red); }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: -.5rem 0 1.25rem; }
  .progress div { height: 100%; background: #9ca3af; transition: width .25s; }

  /* counties */
  .counties { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .county { position: relative; border: 2px solid var(--line); border-radius: 12px; padding: 1rem; background: var(--card); }
  .county h3 { font-size: 1.1rem; }
  .county .desc { font-size: .85rem; color: var(--muted); margin-bottom: .9rem; min-height: 2.5em; }
  .invest-btn { width: 100%; border: 0; border-radius: 10px; padding: .95rem; font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--btn); cursor: pointer; transition: transform .05s; }
  .invest-btn:hover:not(:disabled) { background: #1f2937; }
  .invest-btn:active:not(:disabled) { transform: scale(.98); }
  .invest-btn:disabled { opacity: .4; cursor: not-allowed; }
  .ledger { margin-top: .8rem; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .ledger div { display: flex; justify-content: space-between; }
  .ledger .last { font-weight: 700; }
  .tiles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: .7rem; min-height: 28px; }
  .tile { font-size: .78rem; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #fff; border: 1px solid var(--line); color: var(--green); font-variant-numeric: tabular-nums; }
  .tile.low { color: var(--muted); }

  /* cash animation */
  .btn-wrap { position: relative; }
  .cash { position: absolute; left: 50%; top: -.4rem; transform: translateX(-50%); font-size: 2rem; font-weight: 900; color: var(--green); pointer-events: none; white-space: nowrap;
          text-shadow: 0 1px 0 #fff, 0 0 12px rgba(21,128,61,.25); animation: rise 1.1s ease-out forwards; }
  .cash.low { color: #4b5563; text-shadow: 0 1px 0 #fff; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 30% { transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  body.noanim .cash { animation: none; transform: translate(-50%, -2.6rem); }

  /* tutorial + check */
  .county-pair { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: .75rem 0 1rem; }
  .county-pair .county { padding: .75rem; }
  .q { margin: 1rem 0; }
  .q label { display: block; margin: .3rem 0; cursor: pointer; }
  .q .wrong { color: var(--red); font-size: .9rem; }

  /* end */
  .summary { width: 100%; border-collapse: collapse; margin: 1rem 0; font-variant-numeric: tabular-nums; }
  .summary th, .summary td { padding: .45rem; border-bottom: 1px solid var(--line); text-align: right; }
  .summary th:first-child, .summary td:first-child { text-align: left; }

  .dev { position: fixed; right: 12px; bottom: 12px; background: #111827; color: #e5e7eb; font-size: .78rem; padding: .7rem .8rem; border-radius: 10px; width: 250px; }
  .dev b { color: #fff; } .dev a { color: #93c5fd; } .dev div { margin-bottom: .3rem; }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
// ---------------------------------------------------------------------------
// SunCell investment game: a two-armed bandit framed as money in, money out.
// The player has a fixed budget split into equal investments. Each click invests
// one unit in Riverton (R-leaning) or Lakewood (D-leaning) and shows the sales
// money that comes back. One return is Gamma with shape k_c and mean m_c * UNIT,
// so its SD is mean / sqrt(k_c): the same mean and noise as Poisson(k_c) sales
// in simulate.py, but in continuous dollars.
// Each county's average stays fixed for the whole game. URL overrides, e.g.
// prototype.html?r=1.35&d=1.0&seed=7&dev=1
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const num = (k, def) => (Q.has(k) ? Number(Q.get(k)) : def);
const CFG = {
  budget: num('budget', 100000),
  unit: num('unit', 1000),
  backR: num('r', 1.35),           // average $ back per $1 invested, Riverton
  backD: num('d', 1.00),           // average $ back per $1 invested, Lakewood
  shapeR: num('kr', 2.7),          // noise: SD of one return = mean / sqrt(shape)
  shapeD: num('kd', 2.0),
  centsPer1kProfit: num('cents', 3), // bonus per $1,000 of profit (money back minus money in)
  seed: num('seed', Math.floor(Math.random() * 1e9)),
};
const N_INVEST = Math.round(CFG.budget / CFG.unit);
const DEV = Q.get('dev') === '1';
const SHOT = Q.get('shot');

const COUNTY = {
  R: { name: 'Riverton County', short: 'Riverton', desc: 'Republican-leaning: 70% of voters chose the Republican candidate' },
  D: { name: 'Lakewood County', short: 'Lakewood', desc: 'Democratic-leaning: 70% of voters chose the Democratic candidate' },
};

// Seeded PRNG + Gamma draw (Marsaglia-Tsang), so a seed reproduces a game
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(CFG.seed);
function normal() { let u = 0, v = 0; while (u === 0) u = rand(); while (v === 0) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function gamma(k) {
  if (k < 1) return gamma(k + 1) * Math.pow(rand(), 1 / k);
  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) { let x, v; do { x = normal(); v = 1 + c * x; } while (v <= 0); v = v * v * v; const u = rand();
    if (u < 1 - 0.0331 * x ** 4 || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v; }
}
const draw = c => { const k = c === 'R' ? CFG.shapeR : CFG.shapeD, m = c === 'R' ? CFG.backR : CFG.backD;
  return Math.round(gamma(k) * (m * CFG.unit / k) / 10) * 10; };

// --------------------------------- state -----------------------------------
const S = { screen: 'tut1', check: {}, checkTried: false, log: [], last: null, busy: false };
const invested = c => S.log.filter(v => !c || v.county === c).length * CFG.unit;
const back = c => S.log.filter(v => !c || v.county === c).reduce((s, v) => s + v.back, 0);
const profit = () => back() - invested();
const bonus = () => Math.max(0, profit()) / 1000 * CFG.centsPer1kProfit / 100;
const $ = x => (x < 0 ? '−$' : '$') + Math.abs(Math.round(x)).toLocaleString('en-US');
const $s = x => (x >= 0 ? '+' : '') + $(x);

function invest(c) {
  if (S.busy || S.log.length >= N_INVEST) return;
  const rec = { n: S.log.length + 1, county: c, invested: CFG.unit, back: draw(c), t: Date.now() };
  S.log.push(rec); S.last = rec; S.busy = true; render();
  setTimeout(() => {
    S.busy = false;
    if (S.log.length >= N_INVEST) { S.screen = 'end'; render(); return; }
    document.querySelectorAll('.invest-btn').forEach(b => { b.disabled = false; }); // no re-render, so the cash animation plays out
  }, SHOT ? 0 : 450);
}

// --------------------------------- views -----------------------------------
const h = (s, ...v) => s.reduce((a, str, i) => a + str + (i < v.length ? v[i] : ''), '');
const nav = (back, next, label = 'Next', disabled = false) => h`<div class="actions">
  ${back ? `<button class="secondary-btn" onclick="S.screen='${back}';render()">Back</button>` : '<span></span>'}
  <button class="primary-btn" ${disabled ? 'disabled' : ''} onclick="${next}">${label}</button></div>`;
const countyBox = c => `<div class="county"><h3>${COUNTY[c].name}</h3><div class="desc" style="margin:0">${COUNTY[c].desc}</div></div>`;

const views = {
  tut1: () => h`<div class="steps">Instructions 1 of 3</div>
    <div class="big-emoji">☀️</div><h2>Your job</h2>
    <p>You are the marketing manager for <b>SunCell</b>, a company that sells rooftop solar panels.</p>
    <p>You have a budget of <b>${$(CFG.budget)}</b>. You will invest it <b>${$(CFG.unit)} at a time</b> in one of two counties:</p>
    <div class="county-pair">${countyBox('R')}${countyBox('D')}</div>
    ${nav(null, "S.screen='tut2';render()")}`,

  tut2: () => h`<div class="steps">Instructions 2 of 3</div>
    <div class="big-emoji">💵</div><h2>Money in, money out</h2>
    <p>Each time you click, you invest ${$(CFG.unit)} in that county, and you see right away how much money came back from sales.</p>
    <p>Counties differ: in some, ${$(CFG.unit)} brings back more money on average than in others. Either county could be the better one.</p>
    <p>Any single investment is mostly luck. A good county can bring back little, and a weak county can bring back a lot. To tell which county is better, look at many investments, not one.</p>
    <p>Each county's average stays the same for the whole game.</p>
    ${nav('tut1', "S.screen='tut3';render()")}`,

  tut3: () => {
    const qs = [
      { id: 'q1', text: `One ${$(CFG.unit)} investment in a county brought back only $200. Does that mean the county is a bad place to invest?`,
        opts: ['Yes', 'Not necessarily: one investment is mostly luck'], right: 1 },
      { id: 'q2', text: 'Does the average amount each county brings back change during the game?', opts: ['Yes, it changes', 'No, it stays the same'], right: 1 },
    ];
    const ok = qs.every(q => S.check[q.id] === q.right);
    const all = qs.every(q => S.check[q.id] != null);
    return h`<div class="steps">Instructions 3 of 3</div>
    <div class="big-emoji">🎯</div><h2>Your bonus</h2>
    <p>You earn <b>${CFG.centsPer1kProfit}¢ for every ${$(1000)} of profit</b> (money back minus money invested). The more money comes back, the bigger your bonus.</p>
    <h2 style="margin-top:1.25rem">Quick check</h2>
    ${qs.map(q => h`<div class="q"><div>${q.text}</div>${q.opts.map((o, i) => `<label><input type="radio" name="${q.id}" ${S.check[q.id] === i ? 'checked' : ''} onchange="S.check.${q.id}=${i};S.checkTried=false;render()"> ${o}</label>`).join('')}
      ${S.checkTried && S.check[q.id] !== q.right ? '<div class="wrong">Not quite. Please read the instructions again.</div>' : ''}</div>`).join('')}
    ${nav('tut2', ok ? "S.screen='game';render()" : "S.checkTried=true;render()", 'Start investing', !all)}`;
  },

  game: () => {
    const left = CFG.budget - invested(), p = profit();
    const card = c => {
      const mine = S.log.filter(v => v.county === c);
      const cash = S.busy && S.last && S.last.county === c
        ? `<div class="cash ${S.last.back < CFG.unit ? 'low' : ''}">+${$(S.last.back)}</div>` : '';
      return h`<div class="county">
        <h3>${COUNTY[c].name}</h3><div class="desc">${COUNTY[c].desc}</div>
        <div class="btn-wrap"><button class="invest-btn" ${S.busy || left <= 0 ? 'disabled' : ''} onclick="invest('${c}')">Invest ${$(CFG.unit)} in ${COUNTY[c].short}</button>${cash}</div>
        <div class="ledger">
          <div><span>Invested</span><span>${$(invested(c))}</span></div>
          <div><span>Money back</span><span>${$(back(c))}</span></div>
          <div class="last"><span>Last investment</span><span>${mine.length ? $(mine[mine.length - 1].back) : '–'}</span></div>
        </div>
        <div class="tiles">${mine.slice(-8).map(v => `<span class="tile ${v.back < CFG.unit ? 'low' : ''}">${$(v.back)}</span>`).join('')}</div>
      </div>`;
    };
    return h`
    <div class="bank">
      <div><div class="lbl">Budget left</div><div class="val">${$(left)}</div></div>
      <div><div class="lbl">Money back so far</div><div class="val">${$(back())}</div></div>
      <div><div class="lbl">Profit so far</div><div class="val ${p > 0 ? 'pos' : p < 0 ? 'neg' : ''}">${$s(p)}</div></div>
    </div>
    <div class="progress"><div style="width:${100 * invested() / CFG.budget}%"></div></div>
    <div class="counties">${card('R')}${card('D')}</div>
    <p class="muted" style="margin-top:1rem;text-align:center">${S.log.length === 0 ? `Click a county to make your first ${$(CFG.unit)} investment.` : `Investment ${S.log.length} of ${N_INVEST}. Bonus so far: $${bonus().toFixed(2)}`}</p>`;
  },

  end: () => {
    const blob = encodeURIComponent(JSON.stringify({ config: CFG, investments: S.log }, null, 1));
    const row = c => `<tr><td>${COUNTY[c].name}</td><td>${S.log.filter(v => v.county === c).length}</td><td>${$(invested(c))}</td><td>${$(back(c))}</td><td>${$s(back(c) - invested(c))}</td></tr>`;
    return h`<h2>All invested</h2>
    <p>You invested your whole ${$(CFG.budget)} budget and got back <b>${$(back())}</b>, a profit of <b>${$s(profit())}</b>.</p>
    <p>Your bonus is <b>$${bonus().toFixed(2)}</b>.</p>
    <table class="summary"><tr><th>County</th><th>Investments</th><th>Invested</th><th>Money back</th><th>Profit</th></tr>${row('R')}${row('D')}</table>
    <p class="muted"><a download="investment_log.json" href="data:application/json,${blob}">Download this game's investment log (JSON)</a></p>`;
  },
};

function devPanel() {
  if (!DEV) return '';
  const link = set => { const q = new URLSearchParams(location.search); Object.entries(set).forEach(([a, b]) => q.set(a, b)); return '?' + q.toString(); };
  return h`<div class="dev"><div><b>Researcher panel</b> (hidden from participants)</div>
    <div>Truth: $1 brings back $${CFG.backR.toFixed(2)} in Riverton, $${CFG.backD.toFixed(2)} in Lakewood</div>
    <div>Noise: one return's SD is ${Math.round(100 / Math.sqrt(CFG.shapeR))}% (R) / ${Math.round(100 / Math.sqrt(CFG.shapeD))}% (D) of its mean</div>
    <div>All in Riverton: about ${$(CFG.budget * CFG.backR)} back, bonus $${(Math.max(0, CFG.budget * (CFG.backR - 1)) / 1000 * CFG.centsPer1kProfit / 100).toFixed(2)}</div>
    <div>Seed ${CFG.seed} · <a href="${link({ seed: Math.floor(Math.random() * 1e9) })}">new luck</a></div></div>`;
}

function render() {
  document.getElementById('app').innerHTML = views[S.screen]();
  const old = document.querySelector('.dev'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', devPanel());
}

// ---------- screenshot states (?shot=tut1|tut2|tut3|game0|game|end) ----------
if (SHOT) {
  document.body.classList.add('noanim');
  if (SHOT.startsWith('tut')) S.screen = SHOT;
  if (SHOT === 'tut3') S.check = { q1: 1, q2: 1 };
  if (SHOT === 'game0') S.screen = 'game';
  if (SHOT === 'game' || SHOT === 'end') {
    S.screen = 'game';
    const n = SHOT === 'game' ? num('n', 23) : N_INVEST;
    for (let i = 0; i < n; i++) { S.busy = false; invest(rand() < 0.6 ? 'R' : 'D'); }
    S.busy = SHOT === 'game'; // keep the cash label visible for the screenshot
    if (SHOT === 'end') { S.busy = false; S.screen = 'end'; }
  }
}
render();
</script>
</body>
</html>
